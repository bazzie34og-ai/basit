<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><title>Forms</title></head>
<body>
<!-- Hidden form definitions for Netlify Forms detection. "site-diagnostics" stores
     email-delivery and deploy self-check results so they can be reviewed in Netlify Forms. -->
<form name="site-diagnostics" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="site-diagnostics" />
  <input name="bot-field" />
  <input name="name" />
  <input name="title" />
  <textarea name="message"></textarea>
</form>
</body></html>
