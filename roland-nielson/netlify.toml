# Netlify settings. If this project lives in a subfolder of the repo, set
# Site settings → Build & deploy → Base directory to that folder (e.g. roland-nielson).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[build.processing.html]
  pretty_urls = true

# Security headers for every page.
# script-src has no 'unsafe-inline': that blocks Netlify's "Powered by Netlify" badge
# (an inline script Netlify adds at its servers). The only inline script the site keeps
# is the one-line 'js' class setter in src/layouts/Base.astro, allowed by its sha256 hash.
# If that line changes, update the hash:
#   printf "%s" "<exact script text>" | openssl dgst -sha256 -binary | base64
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-/x7W7R75k8Roq0WaVRQX9blP4OufE5xbAdzklGxsgpw=' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://i.ytimg.com https://*.google-analytics.com https://*.googletagmanager.com https://maps.gstatic.com https://*.googleapis.com https://*.ggpht.com; font-src 'self'; media-src 'self'; frame-src https://www.youtube-nocookie.com https://www.google.com https://maps.google.com https://calendly.com; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; form-action 'self'; base-uri 'self'; frame-ancestors 'self'; object-src 'none'; upgrade-insecure-requests"

# Hashed build assets never change: cache for a year.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.vtt"
  [headers.values]
    Content-Type = "text/vtt; charset=utf-8"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[functions]
  directory = "netlify/functions"

# Deploy-time email self-check (see netlify/plugins/smtp-check). Never fails the build.
[[plugins]]
  package = "./netlify/plugins/smtp-check"
