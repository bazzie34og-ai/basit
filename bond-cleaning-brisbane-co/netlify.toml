# Bond Cleaning Brisbane Co. (Astro static site)
# If the Netlify site is linked to the whole repo, set Base directory = bond-cleaning-brisbane-co.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# ---------------------------------------------------------------------------
# NOINDEX FOR PREVIEWS
# The build writes "X-Robots-Tag: noindex" into dist/_headers (and a robots meta
# tag) unless SITE_URL is exactly https://bondcleaningco.com. Deploy previews and
# branch deploys are forced to noindex here as well.
# GO-LIVE: set SITE_URL=https://bondcleaningco.com in Netlify (Site configuration >
# Environment variables, production context) and redeploy. Nothing else to remove.
# ---------------------------------------------------------------------------
[context.deploy-preview.environment]
  NOINDEX = "true"
[context.branch-deploy.environment]
  NOINDEX = "true"

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.googletagmanager.com https://www.google-analytics.com; font-src 'self'; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
